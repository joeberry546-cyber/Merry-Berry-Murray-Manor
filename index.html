<style>
  :root{
    --paper:#EFEEE6;
    --card:#FFFFFF;
    --card-2:#E8E4D8;
    --ink:#1E2A3A;
    --ink-soft:#5B6472;
    --ink-faint:#8B93A0;
    --line:#DAD5C7;
    --accent:#A6752E;
    --accent-ink:#FFFFFF;
    --accent-soft:#F0E3CC;
    --good:#3F7D58;
    --good-soft:#DCEBE0;
    --warn:#C2793A;
    --warn-soft:#F3E1CD;
    --bad:#B23B3B;
    --bad-soft:#F5DEDE;
    --neutral:#8B93A0;
    --neutral-soft:#E7E4DA;
    --shadow: 0 1px 2px rgba(30,42,58,0.06), 0 4px 16px rgba(30,42,58,0.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151A22;
      --card:#1D242F;
      --card-2:#242C39;
      --ink:#EAE7DC;
      --ink-soft:#A7AFBD;
      --ink-faint:#727C8C;
      --line:#2C3444;
      --accent:#D6A254;
      --accent-ink:#1B140A;
      --accent-soft:#3A2F1D;
      --good:#5FAE7C;
      --good-soft:#1E3327;
      --warn:#E0975A;
      --warn-soft:#3A2A18;
      --bad:#E07070;
      --bad-soft:#3A1F1F;
      --neutral:#8B93A0;
      --neutral-soft:#2A303B;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#151A22;
    --card:#1D242F;
    --card-2:#242C39;
    --ink:#EAE7DC;
    --ink-soft:#A7AFBD;
    --ink-faint:#727C8C;
    --line:#2C3444;
    --accent:#D6A254;
    --accent-ink:#1B140A;
    --accent-soft:#3A2F1D;
    --good:#5FAE7C;
    --good-soft:#1E3327;
    --warn:#E0975A;
    --warn-soft:#3A2A18;
    --bad:#E07070;
    --bad-soft:#3A1F1F;
    --neutral:#8B93A0;
    --neutral-soft:#2A303B;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Libre Franklin', system-ui, sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  button{font-family:inherit;}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  ::selection{background:var(--accent-soft);}

  #app{display:flex; flex-direction:column; height:100%;}

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .brand{min-width:0;}
  .brand h1{font-size:19px; font-weight:600; letter-spacing:-0.01em; line-height:1.15;}
  .brand .tag{display:block; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px;}
  .conn-dot{width:8px; height:8px; border-radius:50%; background:var(--neutral); flex-shrink:0; margin-top:6px;}
  .conn-dot.ok{background:var(--good);}
  .conn-dot.bad{background:var(--bad);}
  .search-row{margin-top:12px; display:flex; gap:8px;}
  .search-row input[type="search"]{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:9px 12px; font-size:14px; min-width:0;
  }
  .search-row input::placeholder{color:var(--ink-faint);}

  main{flex:1; overflow-y:auto; padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; width:100%;}

  .readonly-banner{
    background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
    border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:14px;
  }
  .error-banner{
    background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);
    border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:14px; line-height:1.5;
  }
  .error-banner button{
    display:block; margin-top:8px; background:var(--bad); color:#fff; border:none;
    border-radius:8px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer;
  }

  section.block{margin-bottom:26px;}
  section.block h2{font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-family:'Libre Franklin',sans-serif; font-weight:700; margin-bottom:10px;}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px;}
  .stat-tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center; box-shadow:var(--shadow);}
  .stat-tile .n{font-family:'Fraunces',serif; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat-tile .l{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; margin-bottom:9px; box-shadow:var(--shadow); cursor:pointer;
  }
  .card:active{transform:scale(0.996);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{font-weight:600; font-size:15px; flex:1; min-width:0;}
  .card-sub{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}
  .card-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; align-items:center;}

  .tag{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600;
    padding:3px 8px; border-radius:100px; letter-spacing:.02em; white-space:nowrap;
  }
  .tag.cat{background:var(--neutral-soft); color:var(--ink-soft);}
  .tag.status-good{background:var(--good-soft); color:var(--good);}
  .tag.status-warn{background:var(--warn-soft); color:var(--warn);}
  .tag.status-bad{background:var(--bad-soft); color:var(--bad);}
  .tag.status-neutral{background:var(--neutral-soft); color:var(--ink-faint);}
  .tag.example{background:var(--accent-soft); color:var(--accent);}
  .cost{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .attn-row{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:11px 12px; margin-bottom:8px; box-shadow:var(--shadow);
  }
  .attn-stripe{width:4px; align-self:stretch; border-radius:3px; flex-shrink:0;}
  .attn-stripe.status-bad{background:var(--bad);}
  .attn-stripe.status-warn{background:var(--warn);}
  .attn-body{flex:1; min-width:0;}
  .attn-title{font-weight:600; font-size:14px;}
  .attn-due{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .btn-mini{
    border:1px solid var(--line); background:var(--card-2); color:var(--ink); border-radius:8px;
    padding:7px 10px; font-size:12px; font-weight:600; white-space:nowrap; cursor:pointer;
  }
  .btn-mini:active{opacity:.75;}

  .empty{
    text-align:center; padding:36px 20px; color:var(--ink-soft);
  }
  .empty h3{font-size:17px; margin-bottom:6px; color:var(--ink);}
  .empty p{font-size:13.5px; margin:0;}

  nav.bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
    max-width:640px; margin:0 auto; width:100%;
  }
  @media (min-width:640px){ nav.bottom{ border-left:1px solid var(--line); border-right:1px solid var(--line); border-radius:14px 14px 0 0; bottom:0; } }
  nav.bottom button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--ink-faint); padding:6px 2px; border-radius:10px; cursor:pointer;
  }
  nav.bottom button svg{width:21px; height:21px;}
  nav.bottom button .lbl{font-size:10.5px; font-weight:600;}
  nav.bottom button.active{color:var(--accent);}

  .fab{
    position:fixed; right:calc(50% - 320px + 18px); bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:19;
    width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    border:none; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  @media (max-width:676px){ .fab{ right:18px; } }
  .fab svg{width:24px; height:24px;}
  .fab:active{transform:scale(0.94);}

  .overlay{
    position:fixed; inset:0; background:rgba(20,20,20,0.42); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--paper); width:100%; max-width:640px; border-radius:18px 18px 0 0;
    max-height:88dvh; display:flex; flex-direction:column;
    transform:translateY(16px); transition:transform .18s ease;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .overlay.open .sheet{transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){ .overlay,.sheet{transition:none;} }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 10px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .sheet-head h2{font-size:17px; font-weight:600;}
  .icon-btn{background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:6px; display:flex; border-radius:8px;}
  .icon-btn:active{background:var(--card-2);}
  .icon-btn svg{width:20px; height:20px;}
  .sheet-body{padding:14px 16px 22px; overflow-y:auto;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:10px 11px; font-size:15px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}

  .form-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; border:none; border-radius:10px; padding:12px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .btn.primary{background:var(--accent); color:var(--accent-ink);}
  .btn.primary:active{opacity:.85;}
  .btn.ghost{background:var(--card-2); color:var(--ink);}
  .btn.danger{background:var(--bad-soft); color:var(--bad);}
  .btn:disabled{opacity:.5; cursor:default;}

  .detail-section{margin-bottom:16px;}
  .detail-section h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:6px; font-weight:700; font-family:'Libre Franklin',sans-serif;}
  .kv-row{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--ink-soft);}
  .kv-row .v{text-align:right; font-weight:500;}
  .contact-line{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line);}
  .contact-line:last-child{border-bottom:none;}
  .contact-line a{color:var(--ink); text-decoration:none; font-size:14px;}
  .copy-btn{background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:4px; display:flex;}
  .copy-btn svg{width:16px; height:16px;}
  .notes-block{white-space:pre-wrap; font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
  .related-project{padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .related-project:last-child{border-bottom:none;}

  .confirm-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bad-soft); border-radius:10px; padding:10px 12px; margin-top:10px;}
  .confirm-row span{font-size:13px; color:var(--bad); font-weight:600;}
  .confirm-row .ops{display:flex; gap:8px;}

  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:100px; font-size:13px; font-weight:600;
    z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; box-shadow:var(--shadow);
    max-width:88%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .filter-chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:100px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  :root[data-theme="dark"] .chip.active, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent);} }

  .clear-examples{font-size:12px; color:var(--ink-faint); text-align:center; padding:4px 64px 4px 4px;}
  .clear-examples button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:12px; padding:0;}

  .setup-wrap{max-width:440px; margin:40px auto; padding:0 20px;}
  .setup-wrap h2{font-size:20px; margin-bottom:8px;}
  .setup-wrap p{color:var(--ink-soft); font-size:13.5px; line-height:1.6; margin:0 0 18px;}
  .setup-wrap ol{color:var(--ink-soft); font-size:13.5px; line-height:1.7; padding-left:20px; margin:0 0 18px;}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1>Merry Berry Murray Manor</h1>
        <span class="tag" id="houseTag">House Log &middot; Est. 2019</span>
      </div>
      <div class="conn-dot" id="connDot" title="Connection status"></div>
    </div>
    <div class="search-row" id="searchRow" hidden>
      <input type="search" id="searchInput" placeholder="Search…">
    </div>
  </header>

  <main id="main"></main>

  <button class="fab" id="fab" aria-label="Add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="bottom">
    <button data-tab="dashboard" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M10 19v-5.5h4V19"/></svg>
      <span class="lbl">Home</span>
    </button>
    <button data-tab="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5 20.5 9.5 9 21H3v-6L14.5 3.5Z"/><path d="M12.5 5.5 18.5 11.5"/></svg>
      <span class="lbl">Projects</span>
    </button>
    <button data-tab="contacts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.25"/><path d="M5 20c0-3.6 3.13-6 7-6s7 2.4 7 6"/></svg>
      <span class="lbl">Contacts</span>
    </button>
    <button data-tab="maintenance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.25"/><path d="M12 9.5V13l2.5 1.5"/><path d="M9 3.5h6"/></svg>
      <span class="lbl">Upkeep</span>
    </button>
  </nav>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function esc(s){
    s = (s===undefined||s===null) ? "" : String(s);
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });

  } catch(e){}

  // ---------- date helpers ----------
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function parseISO(s){
    if(!s) return null;
    var parts = s.split("-");
    if(parts.length!==3) return null;
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }
  function addMonthsISO(iso, months){
    var d = parseISO(iso);
    if(!d) return null;
    var nd = new Date(d.getFullYear(), d.getMonth()+months, d.getDate());
    return nd.getFullYear() + "-" + pad(nd.getMonth()+1) + "-" + pad(nd.getDate());
  }
  function fmtDate(iso){
    var d = parseISO(iso);
    if(!d) return "—";
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
  }
  function daysBetween(aISO, bISO){
    var a = parseISO(aISO), b = parseISO(bISO);
    if(!a||!b) return null;
    return Math.round((b-a)/86400000);
  }

  function maintStatus(item){
    if(!item.lastDone){
      return {status:"neutral", label:"Not tracked", nextDue:null};
    }
    var nextDue = addMonthsISO(item.lastDone, item.intervalMonths||12);
    var today = todayISO();
    var diff = daysBetween(today, nextDue);
    if(diff < 0) return {status:"bad", label:"Overdue", nextDue:nextDue};
    if(diff <= 30) return {status:"warn", label:"Due soon", nextDue:nextDue};
    return {status:"good", label:"On track", nextDue:nextDue};
  }

  function costFmt(n){
    if(n===undefined||n===null||n==="" || isNaN(n)) return null;
    return "$" + Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
  }

  function contactName(id){
    var c = contacts.filter(function(x){return x.id===id;})[0];
    return c ? c.name : null;
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg){
    var el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }

  // ---------- row <-> app mapping ----------
  function rowToProject(r){
    return {
      id:r.id, title:r.title, category:r.category, status:r.status,
      date:r.date, cost:r.cost, contractorId:r.contractor_id, notes:r.notes,
      isExample:!!r.is_example, createdAt:r.created_at
    };
  }
  function rowToContact(r){
    return {
      id:r.id, name:r.name, company:r.company, trade:r.trade, phone:r.phone,
      email:r.email, notes:r.notes, isExample:!!r.is_example, createdAt:r.created_at
    };
  }
  function rowToMaint(r){
    return {
      id:r.id, name:r.name, category:r.category, intervalMonths:r.interval_months,
      lastDone:r.last_done, contactId:r.contact_id, notes:r.notes,
      isExample:!!r.is_example, createdAt:r.created_at
    };
  }
  function projectToRow(p){
    return {
      title:p.title, category:p.category, status:p.status, date:p.date || null,
      cost:(p.cost===undefined||p.cost===null||p.cost==="") ? null : Number(p.cost),
      contractor_id:p.contractorId || null, notes:p.notes||"",
      is_example: !!p.isExample
    };
  }
  function contactToRow(c){
    return {
      name:c.name, company:c.company||"", trade:c.trade||"", phone:c.phone||"",
      email:c.email||"", notes:c.notes||"", is_example: !!c.isExample
    };
  }
  function maintToRow(m){
    return {
      name:m.name, category:m.category||"Other", interval_months:Number(m.intervalMonths)||12,
      last_done:m.lastDone || null, contact_id:m.contactId || null, notes:m.notes||"",
      is_example: !!m.isExample
    };
  }

  // ---------- db wiring ----------
  function setConnDot(state){
    var dot = $("#connDot");
    if(!dot) return;
    dot.className = "conn-dot" + (state==="ok" ? " ok" : state==="bad" ? " bad" : "");
  }

  function initDb(){
    if(!SUPABASE_URL || SUPABASE_URL.indexOf("YOUR_SUPABASE") === 0 ||
       !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf("YOUR_SUPABASE") === 0){
      configured = false;
      renderAll();
      return;
    }
    configured = true;
    if(!window.supabase || !window.supabase.createClient){
      dbFailed = true;
      dbErrorDetail = "The Supabase library didn't load — check your internet connection and reload.";
      setConnDot("bad");
      renderAll();
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    fetchAll(true);

    sb.channel("house-log-changes")
      .on("postgres_changes", {event:"*", schema:"public", table:"projects"}, function(){ fetchOne("projects"); })
      .on("postgres_changes", {event:"*", schema:"public", table:"contacts"}, function(){ fetchOne("contacts"); })
      .on("postgres_changes", {event:"*", schema:"public", table:"maintenance"}, function(){ fetchOne("maintenance"); })
      .subscribe(function(status){
        if(status === "SUBSCRIBED") setConnDot("ok");
        else if(status === "CHANNEL_ERROR" || status === "TIMED_OUT") setConnDot("bad");
      });
  }

  function fetchOne(name){
    var table = sb.from(name).select("*");
    table.then(function(res){
      if(res.error){
        dbFailed = true;
        dbErrorDetail = res.error.message || "";
        setConnDot("bad");
        renderAll();
        return;
      }
      dbFailed = false;
      if(name==="projects") projects = res.data.map(rowToProject);
      if(name==="contacts") contacts = res.data.map(rowToContact);
      if(name==="maintenance") maintenance = res.data.map(rowToMaint);
      setConnDot("ok");
      renderAll();
    });
  }

  function fetchAll(first){
    Promise.all([
      sb.from("projects").select("*"),
      sb.from("contacts").select("*"),
      sb.from("maintenance").select("*")
    ]).then(function(results){
      var errored = results.filter(function(r){ return r.error; });
      if(errored.length){
        dbFailed = true;
        dbErrorDetail = errored[0].error.message || "";
        setConnDot("bad");
        loaded.projects = loaded.contacts = loaded.maintenance = true;
        renderAll();
        return;
      }
      dbFailed = false;
      projects = results[0].data.map(rowToProject);
      contacts = results[1].data.map(rowToContact);
      maintenance = results[2].data.map(rowToMaint);
      loaded.projects = loaded.contacts = loaded.maintenance = true;
      setConnDot("ok");
      renderAll();
    }).catch(function(err){
      dbFailed = true;
      dbErrorDetail = (err && err.message) ? err.message : "Couldn't reach the database.";
      setConnDot("bad");
      loaded.projects = loaded.contacts = loaded.maintenance = true;
      renderAll();
    });
  }

  function clearExamples(){
    var toDelete = [].concat(
      projects.filter(function(x){return x.isExample;}).map(function(x){return {t:"projects", id:x.id};}),
      contacts.filter(function(x){return x.isExample;}).map(function(x){return {t:"contacts", id:x.id};}),
      maintenance.filter(function(x){return x.isExample;}).map(function(x){return {t:"maintenance", id:x.id};})
    );
    Promise.all(toDelete.map(function(d){ return sb.from(d.t).delete().eq("id", d.id); }))
      .then(function(){ toast("Example data cleared"); fetchAll(); });
  }

  function hasExamples(){
    return [].concat(projects, contacts, maintenance).some(function(x){ return x.isExample; });
  }

  function renderBanners(main){
    if(!configured){
      var cb = document.createElement("div");
      cb.className = "error-banner";
      cb.innerHTML = "This page isn't connected to a database yet. Open <span class=\"mono\">index.html</span> and fill in <span class=\"mono\">SUPABASE_URL</span> and <span class=\"mono\">SUPABASE_ANON_KEY</span> near the top of the script, then reload.";
      main.appendChild(cb);
      return;
    }
    if(dbFailed){
      var eb = document.createElement("div");
      eb.className = "error-banner";
      eb.innerHTML = "This page couldn't reach the house data — you're seeing an empty or stale view, not a wiped one. Try reloading the page." +
        (dbErrorDetail ? '<div class="mono" style="margin-top:6px;font-size:10.5px;opacity:.8;">'+esc(dbErrorDetail)+'</div>' : '') +
        '<button id="reloadBtn" type="button">Reload</button>';
      main.appendChild(eb);
      var rb = $("#reloadBtn", eb);
      if(rb) rb.addEventListener("click", function(){ location.reload(); });
    }
  }

    btn.addEventListener("click", function(){
      activeTab = btn.getAttribute("data-tab");

      try{ localStorage.setItem("houselog_tab", activeTab); }catch(e){}
      renderAll();

  $("#fab").addEventListener("click", function(){
    if(activeTab==="dashboard"){ openForm("project", null); return; }
    if(activeTab==="projects"){ openForm("project", null); return; }
    if(activeTab==="contacts"){ openForm("contact", null); return; }
    if(activeTab==="maintenance"){ openForm("maintenance", null); return; }
  });

  $("#searchInput").addEventListener("input", function(e){
    searchTerm = e.target.value.toLowerCase();
    renderList();

  // ---------- render root ----------
  function renderAll(){
    $all("nav.bottom button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===activeTab);
    });
    $("#fab").style.display = "flex";

    var main = $("#main");
    main.innerHTML = "";

    if(activeTab==="dashboard") renderDashboard(main);
    else renderList(main);

  function renderDashboard(main){
    main = main || $("#main");
    renderBanners(main);
    var overdue = maintenance.map(function(m){ return Object.assign({}, m, {_status: maintStatus(m)}); })
      .filter(function(m){ return m._status.status==="bad" || m._status.status==="warn"; })
      .sort(function(a,b){ return (a._status.nextDue||"") < (b._status.nextDue||"") ? -1 : 1; });

    var recentProjects = projects.slice().sort(function(a,b){
      return (b.date||"") < (a.date||"") ? -1 : ((b.date||"")>(a.date||"") ? 1 : (b.createdAt||0)-(a.createdAt||0));
    }).slice(0,5);

    var html = "";
    html += '<div class="stat-row">'+
      '<div class="stat-tile"><div class="n">'+projects.length+'</div><div class="l">Projects</div></div>'+
      '<div class="stat-tile"><div class="n">'+contacts.length+'</div><div class="l">Contacts</div></div>'+
      '<div class="stat-tile"><div class="n">'+overdue.length+'</div><div class="l">Need attention</div></div>'+
    '</div>';

    html += '<section class="block"><h2>Needs attention</h2>';
    if(overdue.length===0){
      html += '<div class="empty" style="padding:22px 12px;"><p>Nothing due soon. Nice work.</p></div>';
    } else {
      overdue.slice(0,8).forEach(function(m){
        html += attnRowHtml(m);
      });
    }
    html += '</section>';

    html += '<section class="block"><h2>Recent projects</h2>';
    if(recentProjects.length===0){
      html += '<div class="empty" style="padding:22px 12px;"><p>No projects logged yet. Tap + to add your first one.</p></div>';
    } else {
      recentProjects.forEach(function(p){ html += projectCardHtml(p); });
    }
    html += '</section>';

    if(hasExamples()){
      html += '<div class="clear-examples">Sample entries are marked <span class="tag example" style="vertical-align:1px;">Example</span> — <button id="clearExBtn">clear them</button> once you\'ve added your own.</div>';
    }

    main.insertAdjacentHTML("beforeend", html);
    bindCardClicks(main);
    var ceb = $("#clearExBtn", main);
    if(ceb) ceb.addEventListener("click", clearExamples);
    $all(".mark-done-btn", main).forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        markDone(btn.getAttribute("data-id"));
      });
    });
  }

  function attnRowHtml(m){
    var st = m._status || maintStatus(m);
    return '<div class="attn-row" data-open="maintenance" data-id="'+esc(m.id)+'">'+
      '<div class="attn-stripe status-'+st.status+'"></div>'+
      '<div class="attn-body">'+
        '<div class="attn-title">'+esc(m.name)+(m.isExample?' <span class="tag example">Example</span>':'')+'</div>'+
        '<div class="attn-due">'+(st.nextDue ? (st.status==="bad"?"Was due ":"Due ")+fmtDate(st.nextDue) : "Set a last-done date")+'</div>'+
      '</div>'+
      '<button class="btn-mini mark-done-btn" data-id="'+esc(m.id)+'">Mark done</button>'+
    '</div>';
  }

  function projectCardHtml(p){
    var cn = p.contractorId ? contactName(p.contractorId) : null;
    var statusClass = p.status==="Done" ? "status-good" : (p.status==="In Progress" ? "status-warn" : "status-neutral");
    var cost = costFmt(p.cost);
    return '<div class="card" data-open="project" data-id="'+esc(p.id)+'">'+
      '<div class="card-top">'+
        '<div class="card-title">'+esc(p.title)+'</div>'+
        (cost ? '<div class="cost">'+cost+'</div>' : '')+
      '</div>'+
      '<div class="card-sub">'+fmtDate(p.date)+(cn ? " · "+esc(cn) : "")+'</div>'+
      '<div class="card-meta">'+
        '<span class="tag cat">'+esc(p.category||"Other")+'</span>'+
        '<span class="tag '+statusClass+'">'+esc(p.status||"Planned")+'</span>'+
        (p.isExample ? '<span class="tag example">Example</span>' : '')+
      '</div>'+
    '</div>';
  }

  function contactCardHtml(c){
    var n = projects.filter(function(p){ return p.contractorId===c.id; }).length;
    return '<div class="card" data-open="contact" data-id="'+esc(c.id)+'">'+
      '<div class="card-top"><div class="card-title">'+esc(c.name)+'</div></div>'+
      '<div class="card-sub">'+(c.company ? esc(c.company)+" · " : "")+esc(c.phone||"")+'</div>'+
      '<div class="card-meta">'+
        '<span class="tag cat">'+esc(c.trade||"Other")+'</span>'+
        (n>0 ? '<span class="tag status-neutral">'+n+' project'+(n===1?"":"s")+'</span>' : '')+
        (c.isExample ? '<span class="tag example">Example</span>' : '')+
      '</div>'+
    '</div>';
  }

  function maintCardHtml(m){
    var st = maintStatus(m);
    var cn = m.contactId ? contactName(m.contactId) : null;
    return '<div class="card" data-open="maintenance" data-id="'+esc(m.id)+'">'+
      '<div class="card-top"><div class="card-title">'+esc(m.name)+'</div></div>'+
      '<div class="card-sub">'+(m.lastDone ? "Last done "+fmtDate(m.lastDone) : "Not tracked yet")+(cn?" · "+esc(cn):"")+'</div>'+
      '<div class="card-meta">'+
        '<span class="tag cat">'+esc(m.category||"Other")+'</span>'+
        '<span class="tag status-'+st.status+'">'+st.label+(st.nextDue?" · "+fmtDate(st.nextDue):"")+'</span>'+
        (m.isExample ? '<span class="tag example">Example</span>' : '')+
      '</div>'+
    '</div>';
  }

  function bindCardClicks(root){
    $all("[data-open]", root).forEach(function(el){
      el.addEventListener("click", function(){
        var type = el.getAttribute("data-open");
        var id = el.getAttribute("data-id");
        openDetail(type, id);
      });
    });
  }

  function markDone(id){
    var m = maintenance.filter(function(x){return x.id===id;})[0];
    if(!m || !sb) return;
    sb.from("maintenance").update({last_done: todayISO()}).eq("id", id).then(function(res){
      if(res.error){ toast("Couldn't save: "+res.error.message); return; }
      toast("Marked done today");
      fetchOne("maintenance");
    });
  }

  // ---------- list views ----------
  function renderList(main){
    main = main || $("#main");
    main.innerHTML = "";
    renderBanners(main);

    if(activeTab==="projects") renderProjects(main);
    else if(activeTab==="contacts") renderContacts(main);
    else if(activeTab==="maintenance") renderMaintenance(main);
  }

  function renderProjects(main){
    var chips = ["All"].concat(PROJECT_STATUSES);
    var chipsHtml = '<div class="filter-chips">'+chips.map(function(c){
      return '<button class="chip'+(projectFilter===c?" active":"")+'" data-filter="'+esc(c)+'">'+esc(c)+'</button>';
    }).join("")+'</div>';

    var list = projects.filter(function(p){
      if(projectFilter!=="All" && p.status!==projectFilter) return false;
      if(!searchTerm) return true;
      var cn = (p.contractorId ? contactName(p.contractorId) : "") || "";
      return (p.title||"").toLowerCase().indexOf(searchTerm)>-1 ||
             (p.category||"").toLowerCase().indexOf(searchTerm)>-1 ||
             cn.toLowerCase().indexOf(searchTerm)>-1 ||
             (p.notes||"").toLowerCase().indexOf(searchTerm)>-1;
    }).sort(function(a,b){
      return (b.date||"") < (a.date||"") ? -1 : ((b.date||"")>(a.date||"") ? 1 : 0);
    });

    var html = chipsHtml;
    if(list.length===0){
      html += '<div class="empty"><h3>No projects yet</h3><p>Tap the + button to log your first house project.</p></div>';
    } else {
      list.forEach(function(p){ html += projectCardHtml(p); });
    }
    main.insertAdjacentHTML("beforeend", html);
    bindCardClicks(main);
    $all(".chip", main).forEach(function(chip){
      chip.addEventListener("click", function(){
        projectFilter = chip.getAttribute("data-filter");
        renderList();
      });
    });
  }

  function renderContacts(main){
    var list = contacts.filter(function(c){
      if(!searchTerm) return true;
      return (c.name||"").toLowerCase().indexOf(searchTerm)>-1 ||
             (c.company||"").toLowerCase().indexOf(searchTerm)>-1 ||
             (c.trade||"").toLowerCase().indexOf(searchTerm)>-1;
    }).sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });

    var html = "";
    if(list.length===0){
      html += '<div class="empty"><h3>No contacts yet</h3><p>Add the contractors and companies you rely on for the house.</p></div>';
    } else {
      list.forEach(function(c){ html += contactCardHtml(c); });
    }
    main.insertAdjacentHTML("beforeend", html);
    bindCardClicks(main);
  }

  function renderMaintenance(main){
    var list = maintenance.map(function(m){ return Object.assign({}, m, {_status: maintStatus(m)}); });
    if(searchTerm){
      list = list.filter(function(m){
        return (m.name||"").toLowerCase().indexOf(searchTerm)>-1 ||
               (m.category||"").toLowerCase().indexOf(searchTerm)>-1;
      });
    }
    var order = {bad:0, warn:1, neutral:2, good:3};
    list.sort(function(a,b){
      var oa = order[a._status.status], ob = order[b._status.status];
      if(oa!==ob) return oa-ob;
      return (a._status.nextDue||"9999") < (b._status.nextDue||"9999") ? -1 : 1;
    });

    var html = "";
    if(list.length===0){
      html += '<div class="empty"><h3>Nothing to track yet</h3><p>Add filters, tune-ups, and anything else on a schedule.</p></div>';
    } else {
      list.forEach(function(m){ html += maintCardHtml(m); });
    }
    main.insertAdjacentHTML("beforeend", html);
    bindCardClicks(main);
  }

  // ---------- detail sheets ----------

      '</div>'+
      '<div id="delConfirmZone"></div>';

      el.addEventListener("click", function(){
        openDetail(el.getAttribute("data-open2"), el.getAttribute("data-id2"));

    if(editBtn) editBtn.addEventListener("click", function(){ openForm(type, item); });
    var delBtn = $("#delBtn", $("#sheet"));
    if(delBtn) delBtn.addEventListener("click", function(){
      $("#delConfirmZone", $("#sheet")).innerHTML =
        '<div class="confirm-row"><span>Delete this for good?</span><div class="ops">'+
          '<button class="btn-mini" id="delNo">Cancel</button>'+
          '<button class="btn-mini" id="delYes" style="background:var(--bad);color:#fff;border-color:var(--bad);">Delete</button>'+
        '</div></div>';
      $("#delNo").addEventListener("click", function(){ $("#delConfirmZone", $("#sheet")).innerHTML=""; });
      $("#delYes").addEventListener("click", function(){
        var coll = type==="project"?"projects":(type==="contact"?"contacts":"maintenance");
        sb.from(coll).delete().eq("id", item.id).then(function(res){
          if(res.error){ toast("Couldn't delete: "+res.error.message); return; }
          toast("Deleted");
          closeSheet();
          fetchOne(coll);
        });
      });
    });
  }

  function copyIcon(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>'; }
  function closeIcon(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'; }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Copied"); }).catch(function(){ fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      toast("Copied");
    }catch(e){ toast(text); }
  }

  // ---------- forms ----------
  function openForm(type, existing){
    var html = "";
    if(type==="project"){
      html = projectFormHtml(existing);
    } else if(type==="contact"){
      html = contactFormHtml(existing);
    } else if(type==="maintenance"){
      html = maintFormHtml(existing);
    }
    showSheet(html);
    wireForm(type, existing);
  }

  function selectOptions(list, current){
    return list.map(function(v){ return '<option value="'+esc(v)+'"'+(v===current?" selected":"")+'>'+esc(v)+'</option>'; }).join("");
  }
  function contactSelectOptions(current){
    var opts = '<option value="">— None —</option>';
    contacts.slice().sort(function(a,b){return (a.name||"").localeCompare(b.name||"");}).forEach(function(c){
      opts += '<option value="'+esc(c.id)+'"'+(c.id===current?" selected":"")+'>'+esc(c.name)+'</option>';
    });
    return opts;
  }

  function projectFormHtml(p){
    p = p || {};
    return '<div class="sheet-head"><h2>'+(p.id?"Edit project":"Add project")+'</h2><button class="icon-btn" id="closeSheet">'+closeIcon()+'</button></div>'+
      '<div class="sheet-body"><form id="entityForm">'+
        '<div class="field"><label>Title</label><input required id="f_title" value="'+esc(p.title||"")+'" placeholder="e.g. Replaced kitchen faucet"></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Category</label><select id="f_category">'+selectOptions(PROJECT_CATS, p.category)+'</select></div>'+
          '<div class="field"><label>Status</label><select id="f_status">'+selectOptions(PROJECT_STATUSES, p.status||"Done")+'</select></div>'+
        '</div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Date</label><input type="date" id="f_date" value="'+esc(p.date||todayISO())+'"></div>'+
          '<div class="field"><label>Cost ($)</label><input type="number" inputmode="decimal" id="f_cost" value="'+esc(p.cost!==undefined&&p.cost!==null?p.cost:"")+'" placeholder="0"></div>'+
        '</div>'+
        '<div class="field"><label>Contractor</label><select id="f_contractor">'+contactSelectOptions(p.contractorId)+'</select></div>'+
        '<div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Materials used, warranty info, anything future-you should know…">'+esc(p.notes||"")+'</textarea></div>'+
        '<div class="form-actions">'+
          '<button type="button" class="btn ghost" id="cancelForm">Cancel</button>'+
          '<button type="submit" class="btn primary">Save project</button>'+
        '</div>'+
      '</form></div>';
  }

  function contactFormHtml(c){
    c = c || {};
    return '<div class="sheet-head"><h2>'+(c.id?"Edit contact":"Add contact")+'</h2><button class="icon-btn" id="closeSheet">'+closeIcon()+'</button></div>'+
      '<div class="sheet-body"><form id="entityForm">'+
        '<div class="field"><label>Name</label><input required id="f_name" value="'+esc(c.name||"")+'" placeholder="e.g. Rocky Mountain Plumbing"></div>'+
        '<div class="field"><label>Company</label><input id="f_company" value="'+esc(c.company||"")+'"></div>'+
        '<div class="field"><label>Trade</label><select id="f_trade">'+selectOptions(TRADES, c.trade)+'</select></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Phone</label><input type="tel" id="f_phone" value="'+esc(c.phone||"")+'"></div>'+
          '<div class="field"><label>Email</label><input type="email" id="f_email" value="'+esc(c.email||"")+'"></div>'+
        '</div>'+
        '<div class="field"><label>Notes</label><textarea id="f_notes" placeholder="What they did, how they were, who to ask for…">'+esc(c.notes||"")+'</textarea></div>'+
        '<div class="form-actions">'+
          '<button type="button" class="btn ghost" id="cancelForm">Cancel</button>'+
          '<button type="submit" class="btn primary">Save contact</button>'+
        '</div>'+
      '</form></div>';
  }

  function maintFormHtml(m){
    m = m || {};
    var months = m.intervalMonths || 12;
    return '<div class="sheet-head"><h2>'+(m.id?"Edit item":"Add maintenance item")+'</h2><button class="icon-btn" id="closeSheet">'+closeIcon()+'</button></div>'+
      '<div class="sheet-body"><form id="entityForm">'+
        '<div class="field"><label>Item</label><input required id="f_name" value="'+esc(m.name||"")+'" placeholder="e.g. Furnace filter"></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Category</label><select id="f_category">'+selectOptions(MAINT_CATS, m.category)+'</select></div>'+
          '<div class="field"><label>Frequency</label><select id="f_interval">'+INTERVALS.map(function(i){return '<option value="'+i.months+'"'+(i.months===months?" selected":"")+'>'+i.label+'</option>';}).join("")+'</select></div>'+
        '</div>'+
        '<div class="field"><label>Last done</label><input type="date" id="f_lastdone" value="'+esc(m.lastDone||"")+'"><div class="hint">Leave blank if you haven\'t started tracking this yet.</div></div>'+
        '<div class="field"><label>Contact</label><select id="f_contact">'+contactSelectOptions(m.contactId)+'</select></div>'+
        '<div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Filter size, part number, anything to remember…">'+esc(m.notes||"")+'</textarea></div>'+
        '<div class="form-actions">'+
          '<button type="button" class="btn ghost" id="cancelForm">Cancel</button>'+
          '<button type="submit" class="btn primary">Save item</button>'+
        '</div>'+
      '</form></div>';
  }

  function wireForm(type, existing){
    var sheet = $("#sheet");
    $("#cancelForm", sheet).addEventListener("click", closeSheet);
    $("#entityForm", sheet).addEventListener("submit", function(e){
      e.preventDefault();
      if(!sb){ toast("Not connected — check your setup"); return; }
      var data = {};
      if(type==="project"){
        data = {
          title: $("#f_title").value.trim(),
          category: $("#f_category").value,
          status: $("#f_status").value,
          date: $("#f_date").value || todayISO(),
          cost: $("#f_cost").value ? Number($("#f_cost").value) : null,
          contractorId: $("#f_contractor").value || null,
          notes: $("#f_notes").value.trim()
        };
        if(!data.title){ toast("Give the project a title"); return; }
      } else if(type==="contact"){
        data = {
          name: $("#f_name").value.trim(),
          company: $("#f_company").value.trim(),
          trade: $("#f_trade").value,
          phone: $("#f_phone").value.trim(),
          email: $("#f_email").value.trim(),
          notes: $("#f_notes").value.trim()
        };
        if(!data.name){ toast("Give the contact a name"); return; }
      } else if(type==="maintenance"){
        data = {
          name: $("#f_name").value.trim(),
          category: $("#f_category").value,
          intervalMonths: Number($("#f_interval").value),
          lastDone: $("#f_lastdone").value || null,
          contactId: $("#f_contact").value || null,
          notes: $("#f_notes").value.trim()
        };
        if(!data.name){ toast("Give this item a name"); return; }
      }

      var coll = type==="project"?"projects":(type==="contact"?"contacts":"maintenance");
      var rowFn = type==="project"?projectToRow:(type==="contact"?contactToRow:maintToRow);
      var promise;
      if(existing && existing.id){
        promise = sb.from(coll).update(rowFn(data)).eq("id", existing.id);
      } else {
        var row = rowFn(data);
        row.id = (type==="project"?"p_":(type==="contact"?"c_":"m_")) + Date.now().toString(36) + "_" + uid();
        row.created_at = Date.now();
        promise = sb.from(coll).insert(row);
      }
      promise.then(function(res){
        if(res.error){ toast("Couldn't save: "+res.error.message); return; }
        toast("Saved");
        closeSheet();
        fetchOne(coll);
      });
    });
  }

  // ---------- sheet mechanics ----------
  function showSheet(html){
    $("#sheet").innerHTML = html;
    $("#overlay").classList.add("open");
    $("#closeSheet").addEventListener("click", closeSheet);
    $("#overlay").onclick = function(e){ if(e.target.id==="overlay") closeSheet(); };
  }
  function closeSheet(){
    $("#overlay").classList.remove("open");
  }

  // ---------- boot ----------
  renderAll();
  initDb();

})();
</script>
</body>
</html>
